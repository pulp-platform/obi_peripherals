package:
  name: obi_peripherals
  authors:
    - "Philippe Sauter <phsauter@iis.ee.ethz.ch>"
    - "Hannah Pochert  <hpochert@ethz.ch>"

dependencies:
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git",   rev: "v1.37.0" }
  obi:          { git: "https://github.com/pulp-platform/obi.git",            rev: "v0.1.3"  }

sources:
  # obi_uart
  - obi_uart/rtl/obi_uart_pkg.sv
  - obi_uart/rtl/obi_uart_baudgen.sv
  - obi_uart/rtl/obi_uart_interrupts.sv
  - obi_uart/rtl/obi_uart_modem.sv
  - obi_uart/rtl/obi_uart_rx.sv
  - obi_uart/rtl/obi_uart_tx.sv
  - obi_uart/rtl/obi_uart_register.sv
  - obi_uart/rtl/obi_uart.sv

  - target: any(simulation, verilator)
    files:
      - obi_uart/dv/tb/tb_obi_uart_elab.sv
      - obi_uart/dv/tb/tb_obi_uart_interrupts.sv
      - obi_uart/dv/tb/tb_obi_uart_modem.sv
      - obi_uart/dv/tb/tb_obi_uart_regs.sv
      - obi_uart/dv/tb/tb_obi_uart_rx_fifo_deep.sv
      - obi_uart/dv/tb/tb_obi_uart_rx_fifo.sv
      - obi_uart/dv/tb/tb_obi_uart_rx_line_status.sv
      - obi_uart/dv/tb/tb_obi_uart_rx_smoke.sv
      - obi_uart/dv/tb/tb_obi_uart_top_rx.sv
      - obi_uart/dv/tb/tb_obi_uart_tx_waveform.sv
